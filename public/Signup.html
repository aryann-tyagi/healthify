<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthify Signup</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./src/img/aimed-icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.15/tailwind.min.css">
  <script src="index1.js" type="module" defer></script>
</head>
<style>
  .bg-image {
    background-image: url('./src/img/cover.jpeg');
    background-size: cover;
    background-repeat: no-repeat;
  }

  :root {
    ::-webkit-scrollbar {
      height: 10px;
      width: 10px
    }

    ::-webkit-scrollbar-track {
      background: #efefef;
      border-radius: 6px
    }

    ::-webkit-scrollbar-thumb {
      background: #d5d5d5;
      border-radius: 6px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #c4c4c4
    }
  }
</style>
<body>
  <section class="flex flex-col md:flex-row h-screen items-center">
    <div class="bg-image bg-blue-200 hidden lg:block w-full md:w-1/2 xl:w-2/3 h-screen"></div>
  
    <div class="bg-white w-full md:max-w-md lg:max-w-full md:mx-auto md:mx-0 md:w-1/2 xl:w-1/3 h-screen px-6 lg:px-16 xl:px-12 flex items-center justify-center">
      <div class="w-full h-100">
        <a href="./"><img src="./src/img/aimed.png" alt="brand logo" style="max-width: 160px; height: auto;"/></a>
        <h1 class="text-xl md:text-2xl font-bold leading-tight mt-12">Create your account</h1>
  
        <form id="signupform" class="mt-6">
          <div>
            <label class="block text-gray-700">Full Name</label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name" class="w-full px-4 py-3 rounded-lg bg-gray-200 mt-2 border focus:border-blue-500 focus:bg-white focus:outline-none" required>
          </div>
          
          <div class="mt-4">
            <label class="block text-gray-700">Email Address</label>
            <input type="email" name="email" id="email" placeholder="Enter Email Address" class="w-full px-4 py-3 rounded-lg bg-gray-200 mt-2 border focus:border-blue-500 focus:bg-white focus:outline-none" required>
          </div>
  
          <div class="mt-4">
            <label class="block text-gray-700">Password</label>
            <input type="password" name="password" id="password" placeholder="Enter Password (min 6 characters)" minlength="6" class="w-full px-4 py-3 rounded-lg bg-gray-200 mt-2 border focus:border-blue-500 focus:bg-white focus:outline-none" required>
          </div>

          <p id="errorBox" class="text-red-500 text-sm mt-2"></p>

          <button type="submit" class="w-full block bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-300 hover:to-blue-400 focus:from-green-300 focus:to-blue-400 text-white font-semibold rounded-lg px-4 py-3 mt-6">
            Sign Up
          </button>
        </form>
  
        <hr class="my-6 border-gray-300 w-full">
  
        <p class="mt-8">
          Already have an account? 
          <a href="LoginSignup.html" class="text-green-500 hover:text-green-700 font-semibold">
            Log in
          </a>
        </p>
  
        <p class="text-sm text-gray-500 mt-12">&copy; Healthify<b>AI</b> - All Rights Reserved.</p>
      </div>
    </div>
  </section>  
</body>
</html>
